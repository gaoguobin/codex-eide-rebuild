interface:
  display_name: "EIDE Rebuild"
  short_description: "Rebuild EIDE workspaces and return compact or full JSON build results"
  default_prompt: "Use this Agent Skill when the user asks to compile, rebuild, or verify an EIDE / Embedded IDE for VS Code workspace. It supports natural language prompts such as '你自己编译验证下对不对' and explicit forms such as 'EIDE rebuild C:\\work\\demo\\project.code-workspace'. Resolve the target path, then run `python scripts/eide_rebuild.py rebuild <workspace-or-project-path> --stdout summary` for normal agent work. Prefer a worker subagent when the host supports delegation and policy allows it; fall back to direct execution otherwise. Read the compact JSON summary from stdout, report key failures/diagnostics/artifacts, and keep resultPath available for full JSON, compilerLog, steps, artifacts, and transcript follow-up."
