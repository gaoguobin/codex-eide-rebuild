interface:
  display_name: "EIDE Rebuild"
  short_description: "Rebuild EIDE workspaces and return compact or full JSON build results"
  default_prompt: "Use this Agent Skill when the user asks to compile, rebuild, or verify an EIDE / Embedded IDE for VS Code workspace. It supports natural language prompts such as '你自己编译验证下对不对' and explicit forms such as 'EIDE rebuild C:\\work\\demo\\project.code-workspace'. For normal single-project requests, run `python scripts/eide_rebuild.py rebuild <workspace-or-project-path> --stdout summary` directly. When the user explicitly asks for subagent/delegated/background rebuild work, prefer the `eide-rebuild` custom agent if available. Never run multiple workers against the same project/build directory concurrently. Report a low-noise summary from stdout, keep resultPath available for follow-up, and read full logs only on failure or explicit request."
